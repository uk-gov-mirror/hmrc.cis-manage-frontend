include "frontend.conf"

appName="cis-manage-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en", "cy"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

      construction-industry-scheme {
        protocol = http
        host     = localhost
        port     = 6994
      }
      
      cis-contractor-frontend {
        protocol = http
        host     = localhost
        port     = 6998
      }
      
    }
}

cis-frontend {
  host = "http://localhost:6993"
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "cis-manage-frontend"
}

portal-account {
  host = "http://localhost:8095"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
  login                                     = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue                             = ${host}"/construction-industry-scheme/management"
  signOut                                   = "http://localhost:9553/bas-gateway/sign-out-without-state"
  govUkCISGuidance                          = "https://www.gov.uk/what-is-the-construction-industry-scheme"
  commercialSoftwareSuppliers               = "https://www.gov.uk/government/publications/construction-industry-scheme-cis-commercial-software-suppliers"
  cisContractorsGuidance                    = "https://www.gov.uk/government/publications/construction-industry-scheme-cis-340/construction-industry-scheme-a-guide-for-contractors-and-subcontractors-cis-340"
  cisUpdates                                = "https://www.gov.uk/guidance/help-and-support-for-the-construction-industry-scheme"
  cisMoreInformation                        = "https://www.gov.uk/browse/business/construction-property-management"
  technicalSupportWithHmrcOnlineServices    = "https://www.gov.uk/find-hmrc-contacts/technical-support-with-hmrc-online-services"
  registerAsAProfessionalTaxAgentWithHmrc   = "https://www.gov.uk/guidance/find-out-how-to-register-as-a-professional-tax-agent-with-hmrc"
  taxAgentsAndAdvisorsAuthorisationForms    = "https://www.gov.uk/government/collections/tax-agents-and-advisors-authorisation-forms"
  cis-help-what-is                          = "https://www.gov.uk/what-is-the-construction-industry-scheme"
  cis-help-what-you-must-do-as-a-contractor = "https://www.gov.uk/what-you-must-do-as-a-cis-contractor"
  cis-help-monthly                          = "https://www.gov.uk/what-you-must-do-as-a-cis-contractor/file-your-monthly-returns#guide-contents"
  cis-help-340                              = "https://www.gov.uk/what-you-must-do-as-a-cis-contractor/file-your-monthly-returns#penalties-for-late-returns"
  returnToHome                              = ${host}"/construction-industry-scheme/management"
  cisGuideUrl                               = "https://www.gov.uk/government/publications/construction-industry-scheme-cis-340/construction-industry-scheme-a-guide-for-contractors-and-subcontractors-cis-340"
  cisPayEmployerPayeUrl                     = "https://www.gov.uk/pay-paye-tax"
  cisCheckPenaltiesUrl                      = "https://www.gov.uk/government/publications/compliance-checks-penalties-if-you-dont-file-construction-industry-scheme-returns-on-time-ccfs18b/penalties-for-failure-to-file-returns-on-time-the-construction-industry-scheme-cis-ccfs18b"
  hmrcOnlineServiceDesk                     = "https://www.gov.uk/find-hmrc-contacts/technical-support-with-hmrc-online-services"
  payeCisForAgentsOnlineService             = "https://www.gov.uk/guidance/payecis-for-agents-online-service"
  cisMonthlyReturnsGuidance                 = "https://www.gov.uk/what-you-must-do-as-a-cis-contractor/file-your-monthly-returns"
  cis340PenaltiesForLateReturns             = "https://www.gov.uk/what-you-must-do-as-a-cis-contractor/file-your-monthly-returns#penalties-for-late-returns"
  cisLateFilingPenalty                      = " https://www.gov.uk/pay-construction-industry-scheme-cis-late-filing-penalty"
  cisSubcontractorGrossPaymentStatus        = "https://www.gov.uk/what-you-must-do-as-a-cis-subcontractor/gross-payment-status"
  fileStandardReturn                        = "/construction-industry-scheme/monthly-return/file-your-monthly-return"
  fileNilReturn                             = "/construction-industry-scheme/monthly-return/file-your-nil-return"
  hmrcContactCIS                            = "https://www.gov.uk/government/organisations/hm-revenue-customs/contact/construction-industry-scheme"
  continueReturnJourney                     = "/construction-industry-scheme/monthly-return/continue-return-journey"
  continueAmendReturnJourney                = "/construction-industry-scheme/monthly-return/continue-amend-return-journey"
  confirmAmendment                          = "/construction-industry-scheme/manage-cis-return/amend-monthly-return/confirm-amendments"
  submissionInProgress                      = "/construction-industry-scheme/monthly-return/submission-in-progress"
  submissionUnsuccessfulCannotResubmit      = "/construction-industry-scheme/monthly-return/submission-unsuccessful-cannot-resubmit"
  amendReturn                               = "#"
  paymentsAndDeductions                     = "#"
  noticesAndStatements                      = "#"

  cis-contractor-frontend                   = "/construction-industry-scheme/subcontractor"
  contractorDetailsIntroduction             = "/construction-industry-scheme/contractor-details/introduction"
  contractorDetailsManagement               = "/construction-industry-scheme/contractor-details/manage"
  authoriseClientRequest                    = "/account/authorise-client/agent/{agentCode}/request"
}

host = "http://localhost:6996"

accessibility-statement{
  service-path = "/cis-manage-frontend"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = true,
    forceServiceNavigation = true
}

features {
  welsh-translation: false
}

auditing {
  enabled = true
}
